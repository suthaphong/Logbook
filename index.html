<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVT Logbook</title>

  <!-- PWA & Mobile Web App Meta -->
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CVT Logbook">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/stethoscope.png">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 16px; }
    .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 20px; border: 1px solid #cbd5e1; }
    h2, h3 { color: #1e3a8a; margin-top: 0; }
    .field { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .badge { display: inline-block; padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; font-weight: 600; margin-right: 4px; }
    .badge-pri { background: #dbeafe; color: #1e40af; }
    .badge-sec { background: #fef3c7; color: #92400e; }
    .sync-status { font-size: 0.85rem; margin-top: 8px; font-weight: 600; }
    .btn-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    button { background: #1e3a8a; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.sec { background: #475569; }
    button.sync { background: #0284c7; }
    button.save-url { background: #059669; }
    button.cancel { background: #64748b; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #f1f5f9; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #e2e8f0; color: #1e3a8a; }
    .action-btns { display: flex; gap: 4px; }
    .btn-edit { background: #0284c7; padding: 4px 8px; font-size: 0.75rem; }
    .btn-del { background: #dc2626; padding: 4px 8px; font-size: 0.75rem; }
    .sort-bar { display: flex; gap: 8px; align-items: center; margin-top: 10px; margin-bottom: 6px; flex-wrap: wrap; }
    .sort-bar select { width: auto; flex: 1; min-width: 140px; padding: 6px 8px; font-size: 0.85rem; }
    .sort-btn { background: #0284c7; padding: 6px 10px; font-size: 0.85rem; border-radius: 6px; }
  </style>
</head>
<body>

<!-- Cloud Sync Setup Card -->
<div class="card" style="border-left: 4px solid #0284c7;">
  <h3 style="margin: 0; font-size: 1rem; color: #0369a1;">Google Sheet Cloud Sync</h3>
  
  <div style="margin-top: 10px;">
    <label>Google Apps Script Web App URL (/exec)</label>
    <input type="text" id="webhookInput" placeholder="https://script.google.com/macros/s/.../exec">
    <div style="margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" class="save-url" onclick="handleSaveUrl()">Save URL</button>
      <button type="button" class="sync" onclick="pullFromGoogleSheet(false)">Pull from Sheet</button>
    </div>
  </div>

  <div id="syncStatus" class="sync-status" style="color: #d97706;">Status: Checking...</div>
</div>

<div class="card" id="formCard">
  <h2 id="formTitle">Record Surgical Case</h2>
  <form id="caseForm">
    <!-- Row Index Tracking for Clean Edits & Deletes -->
    <input type="hidden" id="editIndex" value="-1">
    <input type="hidden" id="sheetRow" value="">
    <input type="hidden" id="sheetName" value="">

    <div class="field">
      <label>Date (วดป.)</label>
      <input type="date" id="caseDate" required>
    </div>
    <div class="field">
      <label>HN</label>
      <input type="text" id="hn" placeholder="e.g. 1234567" required>
    </div>
    <div class="field">
      <label>AN (Optional)</label>
      <input type="text" id="an" placeholder="e.g. 6900123">
    </div>
    <div class="field">
      <label>Patient Name (ชื่อ-สกุล)</label>
      <input type="text" id="patientName" placeholder="Patient initials or name" required>
    </div>
    <div class="field">
      <label>Age (อายุ)</label>
      <input type="number" id="age" min="0" max="120" placeholder="Years" required>
    </div>
    <div class="field">
      <label>Role</label>
      <select id="role">
        <option value="Surgeon (ทำเอง)">Surgeon (ทำเอง)</option>
        <option value="Assistant (ช่วยผ่าตัด)">Assistant (ช่วยผ่าตัด)</option>
      </select>
    </div>

    <!-- Primary Category & Procedure -->
    <div class="field">
      <label>Primary Board Category (หมวดหลัก)</label>
      <select id="category" onchange="loadProcedures('primary')"></select>
    </div>
    <div class="field">
      <label>Standard Procedure (EPA / Milestone)</label>
      <select id="procSelect" onchange="handleProcChange('primary')"></select>
    </div>
    <div class="field" id="customProcDiv" style="display:none;">
      <label style="color:#b45309;">Custom / Complex Procedure Detail</label>
      <input type="text" id="customProcName" placeholder="Specify custom procedure...">
    </div>

    <!-- Optional Secondary Category -->
    <div class="field" style="margin-top: 16px; padding-top: 12px; border-top: 1px dashed #cbd5e1;">
      <label>Secondary Category (หมวดรอง - Optional)</label>
      <select id="secCategory" onchange="loadProcedures('secondary')">
        <option value="">-- None (Single System) --</option>
      </select>
    </div>
    <div class="field" id="secProcDiv" style="display:none;">
      <label>Secondary Procedure</label>
      <select id="secProcSelect" onchange="handleProcChange('secondary')"></select>
    </div>
    <div class="field" id="customSecProcDiv" style="display:none;">
      <label style="color:#b45309;">Custom Secondary Procedure Detail</label>
      <input type="text" id="customSecProcName" placeholder="Specify custom secondary procedure...">
    </div>

    <div class="field" style="margin-top: 16px; border-top: 1px solid #cbd5e1; padding-top: 12px;">
      <label>Full Operation Title</label>
      <input type="text" id="opName" placeholder="e.g. CABG x 3 with AVR" required>
    </div>
    <div class="field">
      <label>Diagnosis</label>
      <input type="text" id="diag" placeholder="Diagnosis" required>
    </div>
    <div class="field">
      <label>Attending Staff</label>
      <input type="text" id="staff" placeholder="Staff surgeon name" required>
    </div>
    <div class="field">
      <label>Remarks / Intraoperative Details</label>
      <input type="text" id="remarks" placeholder="Notes...">
    </div>

    <div class="btn-row">
      <button type="submit" id="saveBtn">Save Case</button>
      <button type="button" class="cancel" id="cancelBtn" style="display:none;" onclick="cancelEdit()">Cancel Edit</button>
      <button type="button" class="sec" onclick="exportCSV()">Export CSV</button>
    </div>
  </form>
</div>

<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
    <h3 style="margin: 0;">Logged Cases (<span id="count">0</span>)</h3>
  </div>

  <!-- Sorting Controls -->
  <div class="sort-bar">
    <label style="margin: 0; font-size: 0.8rem;">Sort By:</label>
    <select id="sortFieldSelect" onchange="changeSortField(this.value)">
      <option value="date">Date (วดป.)</option>
      <option value="cat">Type of Operation (Category)</option>
      <option value="staff">Staff Name (อาจารย์)</option>
    </select>
    <button type="button" class="sort-btn" id="sortDirBtn" onclick="toggleSortDirection()">Sort: DESC ▼</button>
  </div>

  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th class="sortable" onclick="setSort('date')">Date <span id="sort-date-icon">▼</span></th>
          <th>HN</th>
          <th>Role</th>
          <th class="sortable" onclick="setSort('cat')">Categories <span id="sort-cat-icon"></span></th>
          <th>Operation / Notes</th>
          <th class="sortable" onclick="setSort('staff')">Staff <span id="sort-staff-icon"></span></th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  var STORAGE_KEY = "cvt_resident_permanent_data";
  var SHEET_URL_KEY = "cvt_sheet_webhook_url";
  var DEFAULT_WEBHOOK_URL = "";

  // Sorting State
  var currentSortField = "date";
  var currentSortDirection = "desc";

  var procs = {
    "1. Pleura, Chest wall, Mediastinum, Pericardial": [
      "VATS Pericardial cyst excision / Window",
      "Excision of Mediastinal mass",
      "Transternal thymectomy",
      "Pleuro-pericardial window",
      "Subxyphoid pericardial drainage",
      "Pericardiectomy",
      "VATS / Opened Surgical pleurodesis",
      "VATS / Opened Decortication",
      "Simple Chest wall resection",
      "Excision of superficial lump / Chest wall lesion",
      "Port-A Removal (Superficial/Chest Wall)",
      "Other (Specify custom procedure...)"
    ],
    "2. Lung Surgery": [
      "VATS Wedge resection of lung",
      "Opened Wedge resection of lung",
      "Opened lobectomy of lung",
      "Pneumonectomy",
      "Repair of lung laceration",
      "Other (Specify custom procedure...)"
    ],
    "3. Esophageal Surgery": [
      "Removal of foreign body in esophagus",
      "Esophagoscopy",
      "Esophageal resection / repair",
      "Other (Specify custom procedure...)"
    ],
    "4. Valve Surgery": [
      "Simple Valve replacement (Aortic / Mitral)",
      "Simple Valve repair",
      "VATS Valve surgery",
      "Other (Specify custom procedure...)"
    ],
    "5. Coronary Artery Bypass Graft (CABG)": [
      "Simple CABG",
      "IMA harvesting",
      "SVG harvesting",
      "Radial artery harvesting",
      "Other (Specify custom procedure...)"
    ],
    "6. Congenital Heart Disease": [
      "Simple ASD closure",
      "PDA clipping / ligation",
      "Palliative congenital heart procedure",
      "Other (Specify custom procedure...)"
    ],
    "7. Aortic Surgery": [
      "Simple thoracic aortic aneurysm repair",
      "Endovascular procedure (TEVAR)",
      "Other (Specify custom procedure...)"
    ],
    "8. Peripheral Vascular Surgery": [
      "Femoro-Femoral cannulation / cutdown",
      "Arterial / Venous vascular repair",
      "Other (Specify custom procedure...)"
    ],
    "9. Endoscopy / Minor / Access": [
      "Bronchoscopy",
      "Esophago-gastroscopy",
      "Central venous line placement",
      "Arterial line placement",
      "Intercostal drainage (ICD)",
      "IABP placement",
      "Tracheostomy",
      "Other (Specify custom procedure...)"
    ]
  };

  function getActiveUrl() {
    var stored = localStorage.getItem(SHEET_URL_KEY);
    if (stored && stored.startsWith("http")) return stored;
    return DEFAULT_WEBHOOK_URL;
  }

  function handleSaveUrl() {
    var val = document.getElementById("webhookInput").value.trim();
    var statusEl = document.getElementById("syncStatus");
    if (!val) {
      statusEl.style.color = "#dc2626";
      statusEl.textContent = "Please paste a URL ending in /exec";
      return;
    }
    localStorage.setItem(SHEET_URL_KEY, val);
    statusEl.style.color = "#059669";
    statusEl.textContent = "URL Saved! Connected to Sheet.";
    pullFromGoogleSheet(true);
  }

  function checkSyncStatus() {
    var statusEl = document.getElementById("syncStatus");
    var input = document.getElementById("webhookInput");
    var activeUrl = getActiveUrl();
    
    if (activeUrl && activeUrl.length > 10) {
      if (input) input.value = activeUrl;
      statusEl.style.color = "#059669";
      statusEl.textContent = "Status: Connected to Google Sheet";
    } else {
      statusEl.style.color = "#d97706";
      statusEl.textContent = "Status: Offline (Paste your Web App URL and tap Save URL)";
    }
  }

  function initCategories() {
    var catSel = document.getElementById("category");
    var secCatSel = document.getElementById("secCategory");
    catSel.innerHTML = "";
    secCatSel.innerHTML = "<option value=''>-- None (Single System) --</option>";

    Object.keys(procs).forEach(function(k) {
      var opt1 = document.createElement("option");
      opt1.value = k;
      opt1.textContent = k;
      catSel.appendChild(opt1);

      var opt2 = document.createElement("option");
      opt2.value = k;
      opt2.textContent = k;
      secCatSel.appendChild(opt2);
    });

    loadProcedures('primary');
  }

  function loadProcedures(type) {
    if (type === 'primary') {
      var cat = document.getElementById("category").value;
      var pSel = document.getElementById("procSelect");
      pSel.innerHTML = "";
      if (procs[cat]) {
        procs[cat].forEach(function(item) {
          var opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          pSel.appendChild(opt);
        });
      }
      handleProcChange('primary');
    } else {
      var secCat = document.getElementById("secCategory").value;
      var secDiv = document.getElementById("secProcDiv");
      var secPSel = document.getElementById("secProcSelect");
      if (!secCat) {
        secDiv.style.display = "none";
        document.getElementById("customSecProcDiv").style.display = "none";
        return;
      }
      secDiv.style.display = "block";
      secPSel.innerHTML = "";
      if (procs[secCat]) {
        procs[secCat].forEach(function(item) {
          var opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          secPSel.appendChild(opt);
        });
      }
      handleProcChange('secondary');
    }
  }

  function handleProcChange(type) {
    if (type === 'primary') {
      var val = document.getElementById("procSelect").value;
      var custDiv = document.getElementById("customProcDiv");
      if (val.indexOf("Other") !== -1) {
        custDiv.style.display = "block";
      } else {
        custDiv.style.display = "none";
        syncFullOpName();
      }
    } else {
      var secVal = document.getElementById("secProcSelect").value;
      var secCustDiv = document.getElementById("customSecProcDiv");
      if (secVal && secVal.indexOf("Other") !== -1) {
        secCustDiv.style.display = "block";
      } else {
        secCustDiv.style.display = "none";
        syncFullOpName();
      }
    }
  }

  function syncFullOpName() {
    if (document.getElementById("editIndex").value !== "-1") return;
    var pVal = document.getElementById("procSelect").value;
    var sVal = document.getElementById("secProcSelect") ? document.getElementById("secProcSelect").value : "";
    var secCat = document.getElementById("secCategory").value;

    if (pVal.indexOf("Other") === -1 && (!secCat || sVal.indexOf("Other") === -1)) {
      if (secCat && sVal) {
        document.getElementById("opName").value = pVal + " + " + sVal;
      } else {
        document.getElementById("opName").value = pVal;
      }
    }
  }

  function getCases() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
      return [];
    }
  }

  function saveCases(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch(e){}
  }

  // --- SORTING HELPERS ---
  function changeSortField(field) {
    currentSortField = field;
    renderList();
  }

  function toggleSortDirection() {
    currentSortDirection = (currentSortDirection === "asc") ? "desc" : "asc";
    renderList();
  }

  function setSort(field) {
    if (currentSortField === field) {
      currentSortDirection = (currentSortDirection === "asc") ? "desc" : "asc";
    } else {
      currentSortField = field;
      currentSortDirection = "asc";
    }
    document.getElementById("sortFieldSelect").value = field;
    renderList();
  }

  function updateSortIcons() {
    var arrow = currentSortDirection === "asc" ? "▲" : "▼";
    document.getElementById("sortDirBtn").textContent = "Sort: " + currentSortDirection.toUpperCase() + " " + arrow;
    document.getElementById("sort-date-icon").textContent = (currentSortField === "date") ? arrow : "";
    document.getElementById("sort-cat-icon").textContent = (currentSortField === "cat") ? arrow : "";
    document.getElementById("sort-staff-icon").textContent = (currentSortField === "staff") ? arrow : "";
  }

  function syncToGoogleSheet(caseData) {
    var webhookUrl = getActiveUrl();
    var statusEl = document.getElementById("syncStatus");
    if (!webhookUrl) return;

    statusEl.textContent = "Sync: Uploading...";
    statusEl.style.color = "#0284c7";

    fetch(webhookUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(caseData)
    }).then(function() {
      statusEl.textContent = "Sync: Saved! Auto-refreshing IDs...";
      statusEl.style.color = "#059669";
      // Auto-pull in background so this new case gets its sheetRow immediately
      setTimeout(function() {
        pullFromGoogleSheet(true);
      }, 1500);
    }).catch(function() {
      statusEl.textContent = "Sync: Saved locally (Sheet offline)";
      statusEl.style.color = "#dc2626";
    });
  }

  function pullFromGoogleSheet(isSilent) {
    var webhookUrl = getActiveUrl();
    var statusEl = document.getElementById("syncStatus");
    if (!webhookUrl) {
      if (!isSilent) {
        statusEl.textContent = "Status: Set URL first.";
        statusEl.style.color = "#d97706";
      }
      return;
    }

    if (!isSilent) {
      statusEl.textContent = "Sync: Pulling cases...";
      statusEl.style.color = "#0284c7";
    }

    fetch(webhookUrl)
      .then(function(res) { return res.json(); })
      .then(function(res) {
        if (res.result === "success" && Array.isArray(res.data)) {
          saveCases(res.data);
          renderList();
          statusEl.textContent = "Status: Up to date (" + res.data.length + " cases)";
          statusEl.style.color = "#059669";
        }
      })
      .catch(function(err) {
        if (!isSilent) {
          statusEl.textContent = "Status: Ready (Local active)";
          statusEl.style.color = "#059669";
        }
      });
  }

  function renderList() {
    var originalList = getCases();
    var tb = document.getElementById("tableBody");
    tb.innerHTML = "";
    document.getElementById("count").textContent = originalList.length;

    updateSortIcons();

    // Map items with original index to preserve edit/delete targeting
    var indexedList = originalList.map(function(item, idx) {
      return { item: item, originalIndex: idx };
    });

    indexedList.sort(function(a, b) {
      var valA = "";
      var valB = "";

      if (currentSortField === "date") {
        valA = a.item.date || "";
        valB = b.item.date || "";
      } else if (currentSortField === "cat") {
        valA = (a.item.cat || "") + " " + (a.item.op || "");
        valB = (b.item.cat || "") + " " + (b.item.op || "");
      } else if (currentSortField === "staff") {
        valA = a.item.staff || "";
        valB = b.item.staff || "";
      }

      var cmp = valA.localeCompare(valB, undefined, { numeric: true, sensitivity: "base" });
      return (currentSortDirection === "asc") ? cmp : -cmp;
    });

    indexedList.forEach(function(entry) {
      var item = entry.item;
      var origIdx = entry.originalIndex;

      var tr = document.createElement("tr");
      var catBadges = '<span class="badge badge-pri">Pri: ' + item.cat + '</span>';
      if (item.secCat) {
        catBadges += '<br><span class="badge badge-sec">Sec: ' + item.secCat + '</span>';
      }
      tr.innerHTML = '<td>' + item.date + '</td>' +
        '<td>' + item.hn + '</td>' +
        '<td><strong>' + item.role + '</strong></td>' +
        '<td>' + catBadges + '</td>' +
        '<td><strong>' + item.op + '</strong><br><small style="color:#64748b;">' + item.diag + (item.remarks ? ' | ' + item.remarks : '') + '</small></td>' +
        '<td>' + item.staff + '</td>' +
        '<td><div class="action-btns">' +
        '<button class="btn-edit" onclick="editItem(' + origIdx + ')">Edit</button>' +
        '<button class="btn-del" onclick="delItem(' + origIdx + ')">Del</button>' +
        '</div></td>';
      tb.appendChild(tr);
    });
  }

  function editItem(idx) {
    var list = getCases();
    var item = list[idx];
    if (!item) return;

    document.getElementById("editIndex").value = idx;
    document.getElementById("sheetRow").value = item.sheetRow || "";
    document.getElementById("sheetName").value = item.sheetName || "";

    document.getElementById("formTitle").textContent = "Edit Case";
    document.getElementById("saveBtn").textContent = "Update Case";
    document.getElementById("cancelBtn").style.display = "inline-block";

    document.getElementById("caseDate").value = item.date;
    document.getElementById("hn").value = item.hn;
    document.getElementById("an").value = item.an || "";
    document.getElementById("patientName").value = item.name || "";
    document.getElementById("age").value = item.age || "";
    document.getElementById("role").value = item.role;
    document.getElementById("category").value = item.cat;
    loadProcedures('primary');

    var pSel = document.getElementById("procSelect");
    var hasMatch = false;
    for (var i = 0; i < pSel.options.length; i++) {
      if (pSel.options[i].value === item.priProc) { hasMatch = true; break; }
    }
    if (hasMatch) {
      pSel.value = item.priProc;
      document.getElementById("customProcDiv").style.display = "none";
    } else {
      pSel.value = "Other (Specify custom procedure...)";
      document.getElementById("customProcDiv").style.display = "block";
      document.getElementById("customProcName").value = item.priProc || "";
    }

    document.getElementById("secCategory").value = item.secCat || "";
    loadProcedures('secondary');
    document.getElementById("opName").value = item.op;
    document.getElementById("diag").value = item.diag;
    document.getElementById("staff").value = item.staff;
    document.getElementById("remarks").value = item.remarks || "";
    document.getElementById("formCard").scrollIntoView({ behavior: 'smooth' });
  }

  function cancelEdit() {
    document.getElementById("caseForm").reset();
    document.getElementById("editIndex").value = "-1";
    document.getElementById("sheetRow").value = "";
    document.getElementById("sheetName").value = "";
    document.getElementById("formTitle").textContent = "Record Surgical Case";
    document.getElementById("saveBtn").textContent = "Save Case";
    document.getElementById("cancelBtn").style.display = "none";
    document.getElementById("caseDate").valueAsDate = new Date();
    document.getElementById("customProcDiv").style.display = "none";
    document.getElementById("secProcDiv").style.display = "none";
    document.getElementById("customSecProcDiv").style.display = "none";
    initCategories();
  }

  // --- BULLETPROOF DELETE FUNCTION ---
  function delItem(idx) {
    var originalList = getCases();
    var item = originalList[idx];
    if (!item) return;

    if (!confirm("Delete this case? (This will also clear the row in your Google Sheet)")) return;

    var webhookUrl = getActiveUrl();
    if (webhookUrl) {
      var statusEl = document.getElementById("syncStatus");
      if (statusEl) {
        statusEl.textContent = "Sync: Deleting from Sheet...";
        statusEl.style.color = "#0284c7";
      }

      // Always send the delete request, passing fallback data if sheetRow is empty
      fetch(webhookUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "delete",
          sheetRow: item.sheetRow || "",
          sheetName: item.sheetName || "",
          cat: item.cat || "",
          hn: item.hn || "",
          date: item.date || ""
        })
      }).then(function() {
        if (statusEl) {
          statusEl.textContent = "Sync: Deleted from Sheet!";
          statusEl.style.color = "#059669";
        }
      }).catch(function(err) {
        console.error("Sheet delete error:", err);
      });
    }

    originalList.splice(idx, 1);
    saveCases(originalList);
    renderList();
  }

  document.getElementById("caseForm").onsubmit = function(e) {
    e.preventDefault();
    var pVal = document.getElementById("procSelect").value;
    var priProcFinal = (pVal.indexOf("Other") !== -1) ? document.getElementById("customProcName").value.trim() : pVal;
    var secCat = document.getElementById("secCategory").value;
    var sVal = document.getElementById("secProcSelect") ? document.getElementById("secProcSelect").value : "";
    var secProcFinal = "";
    if (secCat) {
      secProcFinal = (sVal && sVal.indexOf("Other") !== -1) ? document.getElementById("customSecProcName").value.trim() : sVal;
    }

    var editIdx = parseInt(document.getElementById("editIndex").value, 10);
    var list = getCases();

    var caseData = {
      sheetRow: document.getElementById("sheetRow").value,
      sheetName: document.getElementById("sheetName").value,
      date: document.getElementById("caseDate").value,
      hn: document.getElementById("hn").value.trim(),
      an: document.getElementById("an").value.trim(),
      name: document.getElementById("patientName").value.trim(),
      age: document.getElementById("age").value,
      role: document.getElementById("role").value,
      cat: document.getElementById("category").value,
      priProc: priProcFinal,
      secCat: secCat || "",
      secProc: secProcFinal,
      op: document.getElementById("opName").value.trim(),
      diag: document.getElementById("diag").value.trim(),
      staff: document.getElementById("staff").value.trim(),
      remarks: document.getElementById("remarks").value.trim()
    };

    if (editIdx >= 0 && editIdx < list.length) {
      list[editIdx] = caseData;
    } else {
      list.unshift(caseData);
    }

    saveCases(list);
    renderList();
    syncToGoogleSheet(caseData);
    cancelEdit();
  };

  function exportCSV() {
    var list = getCases();
    if (!list.length) return alert("No cases saved yet");
    var out = "\uFEFFDate,HN,AN,Patient Name,Age,Role,Primary Category,Primary Procedure,Secondary Category,Secondary Procedure,Operation,Diagnosis,Staff,Remarks\r\n";
    list.forEach(function(c) {
      out += '"' + c.date + '","' + c.hn + '","' + (c.an||'') + '","' + (c.name||'') + '","' + (c.age||'') + '","' + c.role + '","' + c.cat + '","' + c.priProc + '","' + c.secCat + '","' + c.secProc + '","' + c.op + '","' + c.diag + '","' + c.staff + '","' + c.remarks + '"\r\n';
    });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "text/csv;charset=utf-8;" }));
    a.download = "CVT_Logbook.csv";
    a.click();
  }

  window.onload = function() {
    document.getElementById("caseDate").valueAsDate = new Date();
    initCategories();
    checkSyncStatus();
    renderList();
  };
</script>

</body>
</html>
