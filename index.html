<script>
  var STORAGE_KEY = "cvt_resident_permanent_data";
  var SHEET_URL_KEY = "cvt_sheet_webhook_url";
  
  // PASTE YOUR FULL WEB APP URL HERE (MUST END IN /exec):
  var DEFAULT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz0mc78AR0JXlmPdax-DFWEG04dZwRmm7Am9GdqxuN5TV_8Z4VSnjCzU1wPaKmyzQge/exec";

  var procs = {
    "1. Pleura, Chest wall, Mediastinum, Pericardial": [
      "VATS Pericardial cyst excision / Window",
      "Excision of Mediastinal mass",
      "Transternal thymectomy",
      "Pleuro-pericardial window",
      "Subxyphoid pericardial drainage",
      "Pericardiectomy",
      "VATS / Opened Surgical pleurodesis",
      "VATS / Opened Decortication",
      "Simple Chest wall resection",
      "Excision of superficial lump / Chest wall lesion",
      "Port-A Removal (Superficial/Chest Wall)",
      "Other (Specify custom procedure...)"
    ],
    "2. Lung Surgery": [
      "VATS Wedge resection of lung",
      "Opened Wedge resection of lung",
      "Opened lobectomy of lung",
      "Pneumonectomy",
      "Repair of lung laceration",
      "Other (Specify custom procedure...)"
    ],
    "3. Esophageal Surgery": [
      "Removal of foreign body in esophagus",
      "Esophagoscopy",
      "Esophageal resection / repair",
      "Other (Specify custom procedure...)"
    ],
    "4. Valve Surgery": [
      "Simple Valve replacement (Aortic / Mitral)",
      "Simple Valve repair",
      "VATS Valve surgery",
      "Other (Specify custom procedure...)"
    ],
    "5. Coronary Artery Bypass Graft (CABG)": [
      "Simple CABG",
      "IMA harvesting",
      "SVG harvesting",
      "Radial artery harvesting",
      "Other (Specify custom procedure...)"
    ],
    "6. Congenital Heart Disease": [
      "Simple ASD closure",
      "PDA clipping / ligation",
      "Palliative congenital heart procedure",
      "Other (Specify custom procedure...)"
    ],
    "7. Aortic Surgery": [
      "Simple thoracic aortic aneurysm repair",
      "Endovascular procedure (TEVAR)",
      "Other (Specify custom procedure...)"
    ],
    "8. Peripheral Vascular Surgery": [
      "Femoro-Femoral cannulation / cutdown",
      "Arterial / Venous vascular repair",
      "Other (Specify custom procedure...)"
    ],
    "9. Endoscopy / Minor / Access": [
      "Bronchoscopy",
      "Esophago-gastroscopy",
      "Central venous line placement",
      "Arterial line placement",
      "Intercostal drainage (ICD)",
      "IABP placement",
      "Tracheostomy",
      "Other (Specify custom procedure...)"
    ]
  };

  function getActiveUrl() {
    var stored = localStorage.getItem(SHEET_URL_KEY);
    if (stored && stored.startsWith("http")) return stored;
    if (DEFAULT_WEBHOOK_URL && DEFAULT_WEBHOOK_URL.startsWith("http") && DEFAULT_WEBHOOK_URL.indexOf("...") === -1) {
      return DEFAULT_WEBHOOK_URL;
    }
    return "";
  }

  function checkSyncStatus() {
    var statusEl = document.getElementById("syncStatus");
    if (!statusEl) return;
    
    var url = getActiveUrl();
    if (url) {
      statusEl.style.color = "#059669";
      statusEl.textContent = "Ready to Sync (Connected)";
    } else {
      statusEl.style.color = "#d97706";
      statusEl.textContent = "Offline / Webhook URL not set in code";
    }
  }

  function initCategories() {
    var catSel = document.getElementById("category");
    var secCatSel = document.getElementById("secCategory");
    if (!catSel || !secCatSel) return;
    
    catSel.innerHTML = "";
    secCatSel.innerHTML = "<option value=''>-- None (Single System) --</option>";

    Object.keys(procs).forEach(function(k) {
      var opt1 = document.createElement("option");
      opt1.value = k;
      opt1.textContent = k;
      catSel.appendChild(opt1);

      var opt2 = document.createElement("option");
      opt2.value = k;
      opt2.textContent = k;
      secCatSel.appendChild(opt2);
    });

    loadProcedures('primary');
  }

  function loadProcedures(type) {
    if (type === 'primary') {
      var cat = document.getElementById("category").value;
      var pSel = document.getElementById("procSelect");
      if (!pSel) return;
      pSel.innerHTML = "";
      if (procs[cat]) {
        procs[cat].forEach(function(item) {
          var opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          pSel.appendChild(opt);
        });
      }
      handleProcChange('primary');
    } else {
      var secCat = document.getElementById("secCategory").value;
      var secDiv = document.getElementById("secProcDiv");
      var secPSel = document.getElementById("secProcSelect");
      if (!secDiv || !secPSel) return;
      if (!secCat) {
        secDiv.style.display = "none";
        document.getElementById("customSecProcDiv").style.display = "none";
        return;
      }
      secDiv.style.display = "block";
      secPSel.innerHTML = "";
      if (procs[secCat]) {
        procs[secCat].forEach(function(item) {
          var opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          secPSel.appendChild(opt);
        });
      }
      handleProcChange('secondary');
    }
  }

  function handleProcChange(type) {
    if (type === 'primary') {
      var val = document.getElementById("procSelect").value;
      var custDiv = document.getElementById("customProcDiv");
      if (!custDiv) return;
      if (val.indexOf("Other") !== -1) {
        custDiv.style.display = "block";
      } else {
        custDiv.style.display = "none";
        syncFullOpName();
      }
    } else {
      var secVal = document.getElementById("secProcSelect").value;
      var secCustDiv = document.getElementById("customSecProcDiv");
      if (!secCustDiv) return;
      if (secVal && secVal.indexOf("Other") !== -1) {
        secCustDiv.style.display = "block";
      } else {
        secCustDiv.style.display = "none";
        syncFullOpName();
      }
    }
  }

  function syncFullOpName() {
    if (document.getElementById("editIndex").value !== "-1") return;
    var pVal = document.getElementById("procSelect").value;
    var sVal = document.getElementById("secProcSelect") ? document.getElementById("secProcSelect").value : "";
    var secCat = document.getElementById("secCategory").value;

    if (pVal.indexOf("Other") === -1 && (!secCat || sVal.indexOf("Other") === -1)) {
      if (secCat && sVal) {
        document.getElementById("opName").value = pVal + " + " + sVal;
      } else {
        document.getElementById("opName").value = pVal;
      }
    }
  }

  function getCases() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
      return [];
    }
  }

  function saveCases(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch(e){}
  }

  function syncToGoogleSheet(caseData) {
    var webhookUrl = getActiveUrl();
    if (!webhookUrl) return;

    var statusEl = document.getElementById("syncStatus");
    if (statusEl) {
      statusEl.textContent = "Sync: Uploading...";
      statusEl.style.color = "#0284c7";
    }

    fetch(webhookUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(caseData)
    }).then(function() {
      if (statusEl) {
        statusEl.textContent = "Sync: Case saved to Google Sheet!";
        statusEl.style.color = "#059669";
      }
    }).catch(function() {
      if (statusEl) {
        statusEl.textContent = "Sync: Saved locally (Sheet offline).";
        statusEl.style.color = "#dc2626";
      }
    });
  }

  function pullFromGoogleSheet(isSilent) {
    var webhookUrl = getActiveUrl();
    if (!webhookUrl) {
      if (!isSilent) alert("Webhook URL not found in code.");
      return;
    }

    var statusEl = document.getElementById("syncStatus");
    if (statusEl) {
      statusEl.textContent = "Sync: Pulling cases...";
      statusEl.style.color = "#0284c7";
    }

    fetch(webhookUrl)
      .then(function(res) { return res.json(); })
      .then(function(res) {
        if (res.result === "success" && Array.isArray(res.data)) {
          saveCases(res.data);
          renderList();
          if (statusEl) {
            statusEl.textContent = "Ready (" + res.data.length + " cases in Sheet)";
            statusEl.style.color = "#059669";
          }
        }
      })
      .catch(function(err) {
        if (statusEl) {
          statusEl.textContent = "Ready to Sync (Local active)";
          statusEl.style.color = "#059669";
        }
      });
  }

  function renderList() {
    var list = getCases();
    var tb = document.getElementById("tableBody");
    if (!tb) return;
    tb.innerHTML = "";
    document.getElementById("count").textContent = list.length;
    list.forEach(function(item, idx) {
      var tr = document.createElement("tr");
      var catBadges = '<span class="badge badge-pri">Pri: ' + item.cat + '</span>';
      if (item.secCat) {
        catBadges += '<br><span class="badge badge-sec">Sec: ' + item.secCat + '</span>';
      }
      tr.innerHTML = '<td>' + item.date + '</td>' +
        '<td>' + item.hn + '</td>' +
        '<td><strong>' + item.role + '</strong></td>' +
        '<td>' + catBadges + '</td>' +
        '<td><strong>' + item.op + '</strong><br><small style="color:#64748b;">' + item.diag + (item.remarks ? ' | ' + item.remarks : '') + '</small></td>' +
        '<td>' + item.staff + '</td>' +
        '<td><div class="action-btns">' +
        '<button class="btn-edit" onclick="editItem(' + idx + ')">Edit</button>' +
        '<button class="btn-del" onclick="delItem(' + idx + ')">Del</button>' +
        '</div></td>';
      tb.appendChild(tr);
    });
  }

  function editItem(idx) {
    var list = getCases();
    var item = list[idx];
    if (!item) return;

    document.getElementById("editIndex").value = idx;
    document.getElementById("formTitle").textContent = "Edit Case (แก้ไขเคส)";
    document.getElementById("saveBtn").textContent = "Update Case";
    document.getElementById("cancelBtn").style.display = "inline-block";

    document.getElementById("caseDate").value = item.date;
    document.getElementById("hn").value = item.hn;
    document.getElementById("an").value = item.an || "";
    document.getElementById("patientName").value = item.name || "";
    document.getElementById("age").value = item.age || "";
    document.getElementById("role").value = item.role;
    document.getElementById("category").value = item.cat;
    loadProcedures('primary');

    var pSel = document.getElementById("procSelect");
    var hasMatch = false;
    for (var i = 0; i < pSel.options.length; i++) {
      if (pSel.options[i].value === item.priProc) { hasMatch = true; break; }
    }
    if (hasMatch) {
      pSel.value = item.priProc;
      document.getElementById("customProcDiv").style.display = "none";
    } else {
      pSel.value = "Other (Specify custom procedure...)";
      document.getElementById("customProcDiv").style.display = "block";
      document.getElementById("customProcName").value = item.priProc || "";
    }

    document.getElementById("secCategory").value = item.secCat || "";
    loadProcedures('secondary');
    document.getElementById("opName").value = item.op;
    document.getElementById("diag").value = item.diag;
    document.getElementById("staff").value = item.staff;
    document.getElementById("remarks").value = item.remarks || "";
    document.getElementById("formCard").scrollIntoView({ behavior: 'smooth' });
  }

  function cancelEdit() {
    document.getElementById("caseForm").reset();
    document.getElementById("editIndex").value = "-1";
    document.getElementById("formTitle").textContent = "Record Surgical Case";
    document.getElementById("saveBtn").textContent = "Save Case";
    document.getElementById("cancelBtn").style.display = "none";
    document.getElementById("caseDate").valueAsDate = new Date();
    document.getElementById("customProcDiv").style.display = "none";
    document.getElementById("secProcDiv").style.display = "none";
    document.getElementById("customSecProcDiv").style.display = "none";
    initCategories();
  }

  function delItem(idx) {
    if (confirm("Delete this case from phone table?")) {
      var list = getCases();
      list.splice(idx, 1);
      saveCases(list);
      renderList();
    }
  }

  document.getElementById("caseForm").onsubmit = function(e) {
    e.preventDefault();
    try {
      var pVal = document.getElementById("procSelect").value;
      var priProcFinal = (pVal.indexOf("Other") !== -1) ? document.getElementById("customProcName").value.trim() : pVal;
      var secCat = document.getElementById("secCategory").value;
      var sVal = document.getElementById("secProcSelect") ? document.getElementById("secProcSelect").value : "";
      var secProcFinal = "";
      if (secCat) {
        secProcFinal = (sVal && sVal.indexOf("Other") !== -1) ? document.getElementById("customSecProcName").value.trim() : sVal;
      }

      var editIdx = parseInt(document.getElementById("editIndex").value, 10);
      var list = getCases();

      var caseData = {
        date: document.getElementById("caseDate").value,
        hn: document.getElementById("hn").value.trim(),
        an: document.getElementById("an").value.trim(),
        name: document.getElementById("patientName").value.trim(),
        age: document.getElementById("age").value,
        role: document.getElementById("role").value,
        cat: document.getElementById("category").value,
        priProc: priProcFinal,
        secCat: secCat || "",
        secProc: secProcFinal,
        op: document.getElementById("opName").value.trim(),
        diag: document.getElementById("diag").value.trim(),
        staff: document.getElementById("staff").value.trim(),
        remarks: document.getElementById("remarks").value.trim()
      };

      if (editIdx >= 0 && editIdx < list.length) {
        list[editIdx] = caseData;
      } else {
        list.unshift(caseData);
      }

      saveCases(list);
      renderList();
      syncToGoogleSheet(caseData);
      cancelEdit();
    } catch(err) {
      alert("Save error: " + err.message);
    }
  };

  function exportCSV() {
    var list = getCases();
    if (!list.length) return alert("No cases saved yet");
    var out = "\uFEFFDate,HN,AN,Patient Name,Age,Role,Primary Category,Primary Procedure,Secondary Category,Secondary Procedure,Operation,Diagnosis,Staff,Remarks\r\n";
    list.forEach(function(c) {
      out += '"' + c.date + '","' + c.hn + '","' + (c.an||'') + '","' + (c.name||'') + '","' + (c.age||'') + '","' + c.role + '","' + c.cat + '","' + c.priProc + '","' + c.secCat + '","' + c.secProc + '","' + c.op + '","' + c.diag + '","' + c.staff + '","' + c.remarks + '"\r\n';
    });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "text/csv;charset=utf-8;" }));
    a.download = "CVT_MultiCategory_Logbook.csv";
    a.click();
  }

  function exportBackupJSON() {
    var list = getCases();
    if (!list.length) return alert("No cases to backup.");
    var blob = new Blob([JSON.stringify(list, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "CVT_Logbook_Backup_" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
  }

  function triggerImport() {
    document.getElementById("importFileInput").click();
  }

  function importBackupJSON(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var importedCases = JSON.parse(e.target.result);
        if (!Array.isArray(importedCases)) throw new Error("Invalid structure");
        if (confirm("Found " + importedCases.length + " cases. Replace current logbook?")) {
          saveCases(importedCases);
          renderList();
        }
      } catch (err) {
        alert("Invalid JSON backup file.");
      }
    };
    reader.readAsText(file);
    event.target.value = "";
  }

  window.onload = function() {
    try {
      document.getElementById("caseDate").valueAsDate = new Date();
      initCategories();
      checkSyncStatus();
      renderList();
      if (getActiveUrl()) {
        pullFromGoogleSheet(true);
      }
    } catch(err) {
      console.error(err);
    }
  };
</script>
